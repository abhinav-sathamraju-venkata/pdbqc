[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdbqc"
version = "0.1.2"
description = "Structure quality report and cleaning for PDB/mmCIF files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "biotite",
    "numpy",
    "rich",
]

[project.urls]
Homepage = "https://github.com/abhinav-sathamraju-venkata/pdbqc"

[project.scripts]
pdbqc = "pdbqc.cli:main"